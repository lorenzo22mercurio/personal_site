<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hi, I'M LOLLO</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
    * {box-sizing: border-box; margin: 0; padding: 0;}
  body 
  {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    line-height: 1.9;
    color: white;
    background: #9fd1f5;
  }
#bg
  {
    position: fixed;
    top: 0;
    left: 0;
    image-rendering: pixelated;
  }
#bg  {z-index: 0;}
.flake
  {
    position: fixed;
    top: -10px;
    width: 6px;
    height: 6px;
    background: white;
    z-index: 1;
    pointer-events: none;
    animation: fall linear infinite;
  }
@keyframes fall {
to  {transform: translateY(110vh);} }
.card 
  {
    position: relative;
    z-index: 2;
    width: calc(100% - 32px);
    max-width: 640px;
    margin: 6vh auto;
    padding: 26px;
    background: rgba(60,60,60,.85);
    border: 6px solid white;
    box-shadow: inset 0 0 0 4px black, 10px 10px 0 black;
  }
.head 
  {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
  }
.avatar 
  {
    width: 128px;
    height: 128px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #6b6b6b;
    border: 4px solid white;
  }
#avatar 
  {
    width: 96px;
    height: 108px;
    image-rendering: pixelated;
  }
h1  {font-size: 16px; line-height: 1.6; margin-bottom: 8px;}
  .sub {color: #bdbdbd;}
  h2 
  {
    display: inline-block;
    margin: 24px 0 10px;
    padding: 3px 10px;
    font-size: 11px;
    color: #1c1c1c;
    background: white;
  }
p  {color: #e6e6e6;}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.tag {
padding: 4px 10px;
border: 3px solid white;
background: black;
}
.tag.know  {color: black; background: white;}
.foot { margin-top: 24px; color: #bdbdbd; }
.foot span  {animation: blink 1s steps(1) infinite;} 
@keyframes blink {
50%  {opacity: 0; }}
  </style>
    </head>
      <body>
        <canvas id="bg"></canvas>
        <main class="card">
        <div class="head">
        <div class="avatar">
        <canvas id="avatar" width="16" height="18"></canvas>
        </div>
        <div>
        <h1>Hi, I'm<br>LOLLO</h1>
        <div class="sub">High school student<br>&amp; beginner coder</div>
        </div>
        </div>
        <h2>ABOUT ME</h2>
        <p>I'm a high school student and I love programming. For now I only know C and HTML, but I'm curious and I want to learn more languages.</p>
        <h2>I KNOW</h2>
        <div class="tags">
        <span class="tag know">C</span>
        <span class="tag know">HTML</span>
        </div>
        <h2>I WANT TO LEARN</h2>
        <div class="tags">
        <span class="tag">Python</span>
        <span class="tag">JavaScript</span>
        <span class="tag">Java</span>
        </div>
        <div class="foot">&gt; still learning<span>_</span></div>
  </main>
<script>
  const bg = document.getElementById("bg");
  const ctx = bg.getContext("2d");
  const avatar = document.getElementById("avatar");
  const avatarCtx = avatar.getContext("2d");
  let scale, width, height;
  function drawPenguin(context) {
    context.fillStyle = "#14141c";
    context.fillRect(3, 0, 10, 3);
    context.fillRect(1, 3, 14, 11);
    context.fillRect(3, 14, 10, 2);
    context.fillStyle = "white";
    context.fillRect(4, 5, 8, 8);
    context.fillRect(3, 7, 10, 5);
    context.fillRect(4, 3, 2, 2);
    context.fillRect(10, 3, 2, 2);
    context.fillStyle = "#ff9f1c";
    context.fillRect(6, 6, 4, 2);
    context.fillRect(2, 16, 5, 2);
    context.fillRect(9, 16, 5, 2);
}
drawPenguin(avatarCtx);

function snowHeight(x) {
  return height * 0.65 + x * 0.25;
}
  function drawMountain(x, top, base, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x - width * 0.25, base);
    ctx.lineTo(x + width * 0.25, base);
    ctx.closePath();
    ctx.fill();
    }
  function drawScene() {
    scale = window.innerWidth < 600 ? 4 : 6;
    width = Math.ceil(window.innerWidth / scale);
    height = Math.ceil(window.innerHeight / scale);
    bg.width = width;
    bg.height = height;
    bg.style.width = width * scale + "px";
    bg.style.height = height * scale + "px";
    const sky = ["#5aa9e6", "#6fb7ec", "#86c4f1", "#9fd1f5", "#b8def8", "#d2eafb"];
    sky.forEach((color, i) => {
    ctx.fillStyle = color;
    ctx.fillRect(0, i * height / 6, width, height / 6 + 1);
  });

ctx.fillStyle = "#fff3b0";
ctx.beginPath();
ctx.arc(width * 0.82, height * 0.14, height * 0.045, 0, Math.PI * 2);
ctx.fill();

drawMountain(width * 0.3, height * 0.18, height * 0.7, "#7d93b5");
drawMountain(width * 0.7, height * 0.25, height * 0.7, "#4a5f86");

for (let x = 0; x < width; x++) {
  const top = Math.floor(snowHeight(x));

for (let y = top; y < height; y++) 
    {
    ctx.fillStyle = y < top + 3 ? "white" : "#cfe0f0";
    ctx.fillRect(x, y, 1, 1);
    }
  }
}
function makeSnow() 
  {
    for (let i = 0; i < 40; i++) {
      const flake = document.createElement("div");
        flake.className = "flake";
        flake.style.left = Math.random() * 100 + "vw";
        flake.style.animationDuration = 6 + Math.random() * 8 + "s";
        flake.style.animationDelay = -Math.random() * 14 + "s";
        document.body.appendChild(flake);
  }
}
  drawScene();
    makeSnow();
      window.addEventListener("resize", drawScene);
  </script>
  </body>
</html>
