<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi, I'm LOLLO</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Press Start 2P',monospace;background:#9fd1f5;color:#fff;line-height:1.9;font-size:11px}
#bg{position:fixed;top:0;left:0;image-rendering:pixelated;z-index:0}
#pen{position:fixed;top:0;left:0;image-rendering:pixelated;z-index:1;pointer-events:none}
.flake{position:fixed;top:-10px;width:6px;height:6px;background:#fff;z-index:1;opacity:.9;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh)}}
.card{position:relative;z-index:2;max-width:640px;margin:6vh 16px;margin-left:auto;margin-right:auto;width:calc(100% - 32px);padding:26px;background:rgba(60,60,60,.72);border:6px solid #fff;box-shadow:inset 0 0 0 4px #000,10px 10px 0 #000}
.head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.avatar{position:relative;width:128px;height:128px;border:4px solid #fff;background:#6b6b6b;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:9px;text-align:center;flex-shrink:0}
#av{image-rendering:pixelated;width:96px;height:108px}
h1{font-size:16px;line-height:1.6;margin-bottom:8px}
.sub{color:#bdbdbd}
h2{font-size:11px;color:#1c1c1c;background:#fff;display:inline-block;padding:3px 10px;margin:24px 0 10px}
p{color:#e6e6e6}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{border:3px solid #fff;background:#000;padding:4px 10px}
.tag.know{background:#fff;color:#000}
.foot{margin-top:24px;color:#8a8a8a}
.foot span{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="pen"></canvas>

<main class="card">
  <div class="head">
    <div class="avatar"><canvas id="av" width="16" height="18"></canvas></div>
    <div>
      <h1>Hi, I'm<br>LOLLO</h1>
      <div class="sub">High school student<br>&amp; beginner coder</div>
    </div>
  </div>

  <h2>ABOUT ME</h2>
  <p>I'm a high school student and I love programming. For now I only know C and HTML, but I'm curious and I want to learn more languages.</p>

  <h2>I KNOW</h2>
  <div class="tags"><span class="tag know">C</span><span class="tag know">HTML</span></div>

  <h2>I WANT TO LEARN</h2>
  <div class="tags"><span class="tag">Python</span><span class="tag">JavaScript</span><span class="tag">Java</span></div>

  <div class="foot">&gt; still learning<span>_</span></div>
</main>

<script>
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');
const pen=document.getElementById('pen');
let S,W,H,ang;

// penguin sprite (K=black, W=white, O=orange)
const spr=[
"..KKKKKKKKK..KKK..",
".KKKKKKKKKKKKKKKK.",
"KKKKKKKKKKKKKWKKOO",
"KKWWWWWWWWWKKKKOO.",
".KWWWWWWWWWWKKK...",
"..WWWWWWWWWWWW....",
"..OO.............."];
const pal={K:'#14141c',W:'#ffffff',O:'#ff9f1c'};
pen.width=18;pen.height=7;
const pc=pen.getContext('2d');
spr.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){pc.fillStyle=pal[ch];pc.fillRect(x,y,1,1)}}));

// profile avatar: pixel art penguin
const av=[
"......KKKK......",
"....KKKKKKKK....",
"...KKKKKKKKKK...",
"..KKKWWKKWWKKK..",
"..KKKWKKKKWKKK..",
"..KKKKOOOOKKKK..",
".KKKKKKOOKKKKKK.",
".KKKKWWWWWWKKKK.",
"KKKKWWWWWWWWKKKK",
"KKKKWWWWWWWWKKKK",
"KKKKWWWWWWWWKKKK",
"KKKKWWWWWWWWKKKK",
".KKKWWWWWWWWKKK.",
".KKKKWWWWWWKKKK.",
"..KKKKKKKKKKKK..",
"...KKKKKKKKKK...",
"..OOOO....OOOO..",
".OOOOOO..OOOOOO."];
const ac=document.getElementById('av').getContext('2d');
av.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){ac.fillStyle=pal[ch];ac.fillRect(x,y,1,1)}}));

const sy=x=>H*0.6+(x/W)*H*0.28;

function layer(peaks,baseY,slope,body,shade,snow,depth){
  for(let x=0;x<W;x++){
    let t=0,side=0;
    for(const p of peaks){const v=p.h-Math.abs(x-p.c)*slope;if(v>t){t=v;side=x>p.c}}
    if(t<=0)continue;
    const top=Math.floor(baseY-t);
    for(let y=top;y<H;y++){
      const snowy=y-top<depth+((x*5)%4);
      ctx.fillStyle=snowy?snow:(side?shade:body);
      ctx.fillRect(x,y,1,1);
    }
  }
}

function scene(){
  S=innerWidth<600?4:6;
  W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);
  cv.width=W;cv.height=H;
  cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  pen.style.width=18*S+'px';pen.style.height=7*S+'px';
  ang=Math.atan((H*0.28)/W);
  // sky in bands
  const sky=['#5aa9e6','#6fb7ec','#86c4f1','#9fd1f5','#b8def8','#d2eafb'];
  sky.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,Math.floor(i*H/6),W,Math.ceil(H/6)+1)});
  // sun
  ctx.fillStyle='#fff3b0';
  for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++)if(x*x+y*y<=26)ctx.fillRect(Math.floor(W*0.82)+x,Math.floor(H*0.14)+y,1,1);
  // mountains
  layer([{c:W*0.18,h:H*0.40},{c:W*0.5,h:H*0.46},{c:W*0.82,h:H*0.36}],H*0.66,1,'#7d93b5','#667ca0','#ffffff',Math.floor(H*0.12));
  layer([{c:W*0.05,h:H*0.26},{c:W*0.35,h:H*0.22},{c:W*0.68,h:H*0.28},{c:W*1.0,h:H*0.24}],H*0.7,1.3,'#4a5f86','#3b4d70','#eef5fc',Math.floor(H*0.07));
  // snowy slope
  for(let x=0;x<W;x++){
    const s=Math.floor(sy(x));
    for(let y=s;y<H;y++){
      const d=y-s;
      ctx.fillStyle=d<2?'#ffffff':((x+y)%2&&d<12?'#e8f1fa':(d<12?'#ffffff':'#cfe0f0'));
      ctx.fillRect(x,y,1,1);
    }
  }
}

function frame(now){
  const p=(now%7000)/7000;
  const x=-20+p*(W+40);
  const y=sy(x)-6.5;
  pen.style.transform='translate('+(x*S)+'px,'+(y*S)+'px) rotate('+ang+'rad)';
  requestAnimationFrame(frame);
}

for(let i=0;i<40;i++){
  const f=document.createElement('div');f.className='flake';
  f.style.left=Math.random()*100+'vw';
  f.style.animationDuration=(6+Math.random()*8)+'s';
  f.style.animationDelay=(-Math.random()*14)+'s';
  document.body.appendChild(f);
}

scene();addEventListener('resize',scene);requestAnimationFrame(frame);
</script>
</body>
</html>
